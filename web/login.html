<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · ZCode Gateway</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="brand login-brand">
      <div class="brand-mark">Z</div>
      <div class="brand-text">
        <strong>ZCode Gateway</strong>
        <span>本地 API 网关</span>
      </div>
    </div>
    <h1>登录管理面板</h1>
    <p class="muted">未登录无法查看账号、额度、日志，也无法执行任何操作。</p>
    <form id="login-form" autocomplete="off">
      <label class="field">
        <span>管理密码</span>
        <input class="input" id="login-password" type="password" placeholder="输入管理密码" autofocus>
      </label>
      <div class="alert error hidden" id="login-error"></div>
      <button class="btn primary block" id="login-submit" type="submit">登录</button>
    </form>
    <p class="login-hint">首次启动时管理密码会打印在服务端控制台；忘记密码时设置环境变量 <code>ZCODE_ADMIN_PASSWORD</code> 后重启即可覆盖。</p>
  </div>
</div>
<script src="/login.js"></script>
</body>
</html>
