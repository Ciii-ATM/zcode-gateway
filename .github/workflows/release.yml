name: Release

# Push a tag like v1.0.0 -> builds 6 platform packages and publishes them
# as a GitHub Release for that exact version.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.27"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BIN=zcode-gateway
          if [ "$GOOS" = "windows" ]; then BIN=zcode-gateway.exe; fi
          mkdir -p pkg
          go build -trimpath -ldflags="-s -w" -o "pkg/$BIN" .
          cp README.md pkg/README.md
          if [ "$GOOS" = "windows" ]; then
            (cd pkg && zip -qr "../zcode-gateway_${VERSION}_${GOOS}_${GOARCH}.zip" .)
          else
            tar -C pkg -czf "zcode-gateway_${VERSION}_${GOOS}_${GOARCH}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zcode-gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: zcode-gateway_*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum zcode-gateway_* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update release
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "ZCode Gateway ${VERSION}" \
              --generate-notes \
              dist/*
          fi